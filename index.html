<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Diagnostic - Endpoint A42187</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<style>
  /* Reset and Fake Terminal */
  body { 
    background-color: #0d1117; 
    color: #00ff00; 
    font-family: 'Courier New', Courier, monospace; 
    text-align: center; 
    padding: 0;
    margin: 0;
    overflow-x: hidden;
    transition: background-color 3s ease, color 3s ease; 
  }
  
  #terminal {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  button#diag-btn { 
    background-color: #00ff00; 
    color: #0d1117; 
    border: none; 
    padding: 12px 28px; 
    cursor: pointer; 
    font-family: inherit; 
    font-weight: bold;
    font-size: 16px; 
    border-radius: 4px;
    margin-top: 30px;
    transition: background-color 0.3s;
  }
  button#diag-btn:hover { background-color: #00cc00; }

  /* Surprise Container */
  #surprise-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 100px 20px;
    box-sizing: border-box;
    display: none; 
  }

  .fade-in {
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .show {
    opacity: 1;
  }

  /* Aesthetic Mode */
  body.aesthetic-mode {
    background-color: #fcfcfc; 
    color: #3d3d3d;
  }

  /* Stylish Heading */
  h1#bday-text { 
    font-family: 'Great Vibes', cursive;
    font-size: 64px;
    background: -webkit-linear-gradient(45deg, #f0a3cc, #b4dce1); 
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0 0 20px 0;
    animation: float 4s ease-in-out infinite;
  }

  /* Main Image & Slideshow Transitions */
  img#main-image {
    width: 90%;
    max-width: 400px;
    height: 400px;
    object-fit: cover; 
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    margin-bottom: 40px;
    transition: opacity 0.8s ease-in-out; 
  }
  
  /* Class to fade out the image during the slideshow */
  .slide-hidden {
    opacity: 0 !important;
  }

  /* Journey Text */
  #journey-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    line-height: 1.8;
    max-width: 700px;
    margin: 0 auto;
    text-align: left;
    white-space: pre-line; 
  }

  /* Animations */
  @keyframes float {
    0% { transform: translatey(0px); }
    50% { transform: translatey(-10px); }
    100% { transform: translatey(0px); }
  }

  @media (max-width: 600px) {
    h1#bday-text { font-size: 48px; }
    img#main-image { 
      height: 300px; 
    }
    #journey-text { font-size: 16px; padding: 0 10px;}
  }
</style>
</head>
<body>

<!-- Fake Terminal -->
<div id="terminal">
  <h2>Fatal Error: 401 Unauthorized Payload</h2>
  <p>System signature mismatch detected in authentication request.</p>
  <p>Please initialize localized diagnostic tool to verify endpoint data.</p>
  <button id="diag-btn" onclick="runPayload()">Authenticate</button>
</div>

<!-- Surprise Container -->
<div id="surprise-container">
  
  <div id="reveal-immediate" class="fade-in">
    <h1 id="bday-text">Happy Birthday Harshini</h1>
    <img id="main-image" src="2.jpg" alt="Us" onload="this.parentNode.classList.add('show')">
  </div>

  <audio id="bgm" src="Happy-Birthday.mp3" loop></audio>

  <div id="journey-block" class="fade-in">
    <div id="journey-text">
    
All the best for your future.
    </div>
  </div>

</div>

<script>
  // Array of images updated to match your new repository files in order
  const slideImages = [
    
    '1.jpg', 
    '2.jpg', 
    '3.jpg', 
    '4.jpg', 
    '5.jpg', 
    '6.jpg', 
    '7.jpg', 
    '8.jpg', 
    '9.jpg', 
    '10.jpg', 
    '11.jpg', 
    '12.jpg', 
    '13.jpg', 
    '14.jpg', 
    '15.jpg', 
    '16.jpg'
  ];
  let currentSlide = 0;

  function runPayload() {
    document.getElementById('terminal').style.display = 'none';
    
    const container = document.getElementById('surprise-container');
    container.style.display = 'flex';
    
    const bgm = document.getElementById('bgm');
    bgm.play().catch(error => { console.log("Audio blocked."); });
    document.body.classList.add('aesthetic-mode');
    
    // 1. Show Heading and Us.jpg immediately
    document.getElementById('reveal-immediate').classList.add('show');

    // 2. Reveal text after 2 seconds
    setTimeout(() => {
        document.getElementById('journey-block').classList.add('show');
    }, 2000); 

    // 3. Start the image slideshow after 5 seconds
    setTimeout(() => {
        startSlideshow();
    }, 5000);
  }

  function startSlideshow() {
    const imgElement = document.getElementById('main-image');
    
    setInterval(() => {
        imgElement.classList.add('slide-hidden');
        
        setTimeout(() => {
            imgElement.src = slideImages[currentSlide];
            currentSlide = (currentSlide + 1) % slideImages.length;
            
            imgElement.classList.remove('slide-hidden');
        }, 800); 

    }, 3500); 
  }
</script>
</body>
</html>
